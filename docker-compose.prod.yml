services:
  traefik:
    image: traefik:v2.10
    env_file:
      - path: ./salonease-mvp/backend/.env
        required: false
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@zenmanager.eu"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      - "--log.level=ERROR"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/man0l/salonease:frontend-latest
    env_file:
      - path: ./salonease-mvp/frontend/.env
        required: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`zenmanager.eu`) && !PathPrefix(`/api`) && !PathPrefix(`/uploads`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/man0l/salonease:backend-latest
    env_file:
      - path: ./salonease-mvp/backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=https://zenmanager.eu
      - CORS_ORIGIN=https://zenmanager.eu
      - PORT=5000
    labels:
      - "traefik.enable=true"
      # Main API router
      - "traefik.http.routers.backend.rule=Host(`zenmanager.eu`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      
      # Static files router for uploads
      - "traefik.http.routers.backend-uploads.rule=Host(`zenmanager.eu`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.backend-uploads.entrypoints=websecure"
      - "traefik.http.routers.backend-uploads.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-uploads.service=backend-service"
      
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=https://zenmanager.eu"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"
      - "traefik.http.services.backend-service.loadbalancer.server.port=5000"
      - "traefik.http.services.backend-service.loadbalancer.passHostHeader=true"
      - "traefik.http.routers.backend.service=backend-service"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./salonease-mvp/backend/uploads:/app/uploads

  # python-runner:
  #   image: ghcr.io/man0l/cold-email-ninja:prod
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=true"
  #   networks:
  #     - app-network
  #   restart: unless-stopped

  # slashloop viral-video research worker — the slashloop repo's queue drainer
  # (src/worker), with no Vercel 60s ceiling so full-length OpenRouter video
  # analysis can finish. Image is built by the slashloop repo's
  # build-worker-image Action on master merges and pushed to GHCR; watchtower
  # auto-updates it here. .env (./slashloop-worker/.env, required:false) holds
  # the CLOUD Supabase creds + OpenRouter/Apify keys — same values as the
  # slashloop Vercel production env.
  #
  # WORKER_KINDS splits the queue across three containers (same image):
  #   slashloop-worker             -> analyze + fetch + thumb
  #   slashloop-worker-maintenance -> rescore
  #   slashloop-worker-scraper     -> refresh + thumb via SCRAPER_PROVIDER=proxy
  # `thumb` is the overflow cover ingest from a refresh past the 15/run cap.
  # It used to sit in queued forever after the kinds split omitted it.
  # Both consume MediaJob rows safely (FOR UPDATE SKIP LOCKED); the Vercel
  # worker defers all claims to these once WORKER_URL is set on Vercel.
  slashloop-worker:
    image: ghcr.io/man0l/slashloop-worker:master
    env_file:
      - path: ./slashloop-worker/.env
        required: false
    environment:
      - WORKER_KINDS=analyze,fetch,thumb
      - WORKER_IDLE_MS=2000
      # Monthly Apify spend cap (cents = USD): was 1000 ($10), raised to $50.
      - APIFY_SPEND_CAP_CENTS=5000
      # Two worker containers share one pgbouncer pool — give the worker a
      # real pool size (src/db.ts reads DB_CONNECTION_LIMIT).
      - DB_CONNECTION_LIMIT=4
      # No 60s ceiling here — let Qwen analyze full-length clips.
      - OPENROUTER_VIDEO_TIMEOUT_MS=300000
      - OPENROUTER_VIDEO_MAX_DURATION_SEC=3600
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    restart: unless-stopped
    # SIGTERM only sets a shutdown flag the worker checks BETWEEN jobs; the
    # in-flight job runs to completion. An analyze job is an OpenRouter video
    # call bounded by OPENROUTER_VIDEO_TIMEOUT_MS (300s), so a 10s stop kills
    # work that has already been paid for and leaves the MediaJob 'running'
    # until reclaimStuckJobs sweeps it 15 minutes later.
    # NOTE: watchtower ignores this and uses WATCHTOWER_TIMEOUT — both must be
    # raised together (see the watchtower service below).
    stop_grace_period: 300s

  slashloop-worker-maintenance:
    image: ghcr.io/man0l/slashloop-worker:master
    env_file:
      - path: ./slashloop-worker/.env
        required: false
    environment:
      - WORKER_KINDS=rescore
      - WORKER_IDLE_MS=5000
      - APIFY_SPEND_CAP_CENTS=5000
      # Two worker containers share one pgbouncer pool — give the worker a
      # real pool size (src/db.ts reads DB_CONNECTION_LIMIT).
      - DB_CONNECTION_LIMIT=4
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    restart: unless-stopped
    # A refresh job is a ~170s Apify scrape plus fan-out across every workspace
    # that shares the same canonical query (multi-tenant batching), all inside
    # one job. Killing it at 10s bills the scrape and applies it to only some
    # subscribers. See slashloop docs/apify-multi-tenant-batching-plan.md 14.4.
    stop_grace_period: 300s

  # Dedicated TikTok proxy scraper. Same image, refresh jobs only, billed per
  # GB through SCRAPER_PROXY_URL (set in ./slashloop-worker/.env). Must not
  # share the refresh kind with the maintenance worker or they race.
  slashloop-worker-scraper:
    image: ghcr.io/man0l/slashloop-worker:master
    env_file:
      - path: ./slashloop-worker/.env
        required: false
    environment:
      - WORKER_KINDS=refresh,thumb
      - WORKER_IDLE_MS=5000
      - WORKER_RESCORE_EVERY=0
      - SCRAPER_PROVIDER=proxy
      - SCRAPER_PROXY_COUNTRY=US
      - SCRAPER_HYDRATE_STATS=8
      - APIFY_SPEND_CAP_CENTS=5000
      - DB_CONNECTION_LIMIT=4
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    restart: unless-stopped
    stop_grace_period: 300s

  db:
    image: pgvector/pgvector:pg13
    command: postgres -c wal_level=logical
    env_file:
      - path: ./salonease-mvp/backend/.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
      - ./supabase/init:/docker-entrypoint-initdb.d/supabase:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - path: ./salonease-mvp/backend/.env
        required: false
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_logs:/var/log/pgadmin
      - ./pgadmin/config_distro.py:/pgadmin4/config_distro.py
    environment:
      - PGADMIN_LISTEN_PORT=80
      - PGADMIN_CONFIG_SERVER_MODE=True
      - PGADMIN_CONFIG_DEFAULT_SERVER=0.0.0.0
    labels:
      - "traefik.enable=true"
      
      # Simplified router configuration
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.zenmanager.eu`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      
      # Service configuration
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      
      # Basic security headers
      - "traefik.http.middlewares.pgadmin-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.pgadmin-headers.headers.stsSeconds=315360000"
      - "traefik.http.middlewares.pgadmin-headers.headers.forceSTSHeader=true"
      
      # Apply the middleware to the router
      - "traefik.http.routers.pgadmin.middlewares=pgadmin-headers"

    networks:
      - app-network
    depends_on:
      - db
    restart: unless-stopped
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      # Watchtower stops containers with ITS OWN timeout and does not read a
      # service's stop_grace_period. At the 10s default it SIGKILLs the
      # slashloop workers mid-job on every auto-update (a scrape or a video
      # analysis runs for minutes). This is the global ceiling; each container
      # still stops as soon as it exits, so slower shutdowns are only paid for
      # when a container is genuinely busy.
      - WATCHTOWER_TIMEOUT=300s
    command: --interval 300 --label-enable
    networks:
      - app-network
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:latest
    env_file:
      - path: ./salonease-mvp/backend/.env
        required: false
    environment:
      - DB_TYPE=postgresdb
      - N8N_HOST=n8n.zenmanager.eu
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.zenmanager.eu/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PROXY_HOPS=1
      - NODE_FUNCTION_ALLOW_EXTERNAL=uuid
      - NODE_FUNCTION_ALLOW_BUILTIN=*
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.zenmanager.eu`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      
      # WebSocket support middleware
      #- "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Origin=n8n.zenmanager.eu"
      #- "traefik.http.routers.n8n.middlewares=websocket-headers"
      
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped


  midjourney-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=strapi
      - POSTGRES_USER=strapi
      - POSTGRES_PASSWORD=${MIDJOURNEY_DB_PASSWORD}
    volumes:
      - midjourney_db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  midjourney-strapi:
    image: ghcr.io/man0l/midjourney-strapi:latest
    env_file:
      - path: ./midjourney-strapi/.env
        required: false
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=midjourney-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=strapi
      - DATABASE_PASSWORD=${MIDJOURNEY_DB_PASSWORD}
      - DATABASE_SSL=false
      - DATABASE_SCHEMA=midjourney-prompt-generator
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi.rule=Host(`strapi.zenmanager.eu`)"
      - "traefik.http.routers.strapi.entrypoints=websecure"
      - "traefik.http.routers.strapi.tls.certresolver=myresolver"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      midjourney-db:
        condition: service_healthy
    restart: unless-stopped

  flowcraft-db:
    image: postgres:15-alpine
    env_file:
      - path: ./flowcraft-strapi/.env
        required: false
    environment:
      - POSTGRES_DB=flowcraft
      - POSTGRES_USER=flowcraft
      - POSTGRES_PASSWORD=${FLOWCRAFT_DB_PASSWORD}
    volumes:
      - flowcraft_db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcraft"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flowcraft-strapi:
    image: ghcr.io/man0l/flowcraft-strapi:latest
    env_file:
      - ./flowcraft-strapi/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=flowcraft-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=flowcraft
      - DATABASE_USERNAME=flowcraft
      - DATABASE_PASSWORD=${FLOWCRAFT_DB_PASSWORD}
      - DATABASE_SSL=false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flowcraft-strapi.rule=Host(`flowcraft-strapi.zenmanager.eu`)"
      - "traefik.http.routers.flowcraft-strapi.entrypoints=websecure"
      - "traefik.http.routers.flowcraft-strapi.tls.certresolver=myresolver"
      - "traefik.http.services.flowcraft-strapi.loadbalancer.server.port=1337"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    volumes:
      - flowcraft_strapi_uploads:/app/public/uploads
    depends_on:
      flowcraft-db:
        condition: service_healthy
    restart: unless-stopped

  # Paperclip (paperclip.ing) — AI company / agent board behind Traefik.
  # Public authenticated mode at https://bots.balkanbit.app (port 3100).
  # Image pre-installs claude/codex/opencode/gemini CLIs for *_local adapters.
  # Secrets live in ./paperclip/.env on the host (required:false so first
  # `docker compose up` still starts); generate once on Contabo:
  #   mkdir -p paperclip && openssl rand -hex 32 ...
  # Dedicated PG17 cluster (paperclip migrations need PG15+ syntax such as
  # UNIQUE NULLS NOT DISTINCT — the pg13 `db` service is too old, and the
  # supabase-db17 superuser login is disabled). PAPERCLIP_DB_PASSWORD lives
  # in the gitignored /.env at compose root; DATABASE_URL in ./paperclip/.env:
  #   DATABASE_URL=postgresql://paperclip:${PAPERCLIP_DB_PASSWORD}@paperclip-db:5432/paperclip
  # Opencode free-subscription login is interactive (user runs it):
  #   docker compose -f docker-compose.prod.yml exec paperclip opencode auth login
  paperclip-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=paperclip
      - POSTGRES_USER=paperclip
      - POSTGRES_PASSWORD=${PAPERCLIP_DB_PASSWORD}
    volumes:
      - paperclip_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    env_file:
      - path: ./paperclip/.env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=3100
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=public
      - PAPERCLIP_PUBLIC_URL=https://bots.balkanbit.app
      - PAPERCLIP_AUTH_PUBLIC_BASE_URL=https://bots.balkanbit.app
      - PAPERCLIP_ALLOWED_HOSTNAMES=bots.balkanbit.app
      - CODEX_HOME=/paperclip/codex-home
      - TRUST_PROXY=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperclip.rule=Host(`bots.balkanbit.app`)"
      - "traefik.http.routers.paperclip.entrypoints=websecure"
      - "traefik.http.routers.paperclip.tls.certresolver=myresolver"
      - "traefik.http.services.paperclip.loadbalancer.server.port=3100"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network
    volumes:
      - paperclip_data:/paperclip
      - ./paperclip/codex-home:/paperclip/codex-home
    depends_on:
      paperclip-db:
        condition: service_healthy
    restart: unless-stopped

  openclaw-gateway:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    image: openclaw-gateway:2026.9.6-opencode
    restart: unless-stopped
    init: true
    # OpenClaw uses a 330s gateway shutdown policy and a persistent owner
    # lease. Compose's default ~10s SIGTERM window force-kills the gateway
    # before it can release that lease, making the next container crash-loop
    # until the stale lease expires.
    stop_grace_period: 340s
    expose:
      - "18789"
    env_file:
      - path: ./openclaw/.env
        required: true
    # Fail visibly instead of starting with an unusable model provider.
    command:
      [
        "/bin/sh",
        "-ec",
        "test -n \"$${OPENCLAW_GATEWAY_TOKEN:-}\" && test -n \"$${OPENROUTER_API_KEY:-}\" && exec node dist/index.js gateway --bind lan --port 18789",
      ]
    environment:
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.prod.json
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_READONLY: "1"
      CODEX_HOME: /home/node/.openclaw/agents/main/agent/codex-home
      OPENCODE_CONFIG: /home/node/.openclaw/opencode.json
      XDG_CONFIG_HOME: /home/node/.openclaw/opencode/config
      XDG_DATA_HOME: /home/node/.openclaw/opencode/share
      XDG_CACHE_HOME: /home/node/.openclaw/opencode/cache
    volumes:
      - openclaw_state:/home/node/.openclaw
      - ./openclaw/openclaw.prod.json:/home/node/.openclaw/openclaw.prod.json:ro
      - ./openclaw/opencode.json:/home/node/.openclaw/opencode.json:ro
      - /root/salonease/openclaw/codex-home:/home/node/.openclaw/agents/main/agent/codex-home
      - /root/salonease/paperclip/codex-home/models.json:/paperclip/codex-home/models.json:ro
    networks:
      - app-network
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "dist/docker-healthcheck.js",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =========================================================================
  # SlashLoop queue producer ingress (queue.slashloop.dev) — SLA-15.
  #
  # Deploy model (no side overrides, no bespoke -f files on the VPS):
  # images come from GitHub Actions (queue-api: build-queue-api-image →
  # ghcr.io/man0l/slashloop-queue-api:master; queue-db/queue-backup: stock
  # postgres:17), THIS file is the only compose source, and the VPS deploy
  # is: git pull (+ .env vars if needed), then
  #   docker compose -f docker-compose.prod.yml up -d queue-db queue-api queue-backup
  # Interpolation vars (SLASHLOOP_QUEUE_*) come from the project `.env`
  # (/root/salonease/.env, mode 600, never committed) — same convention as
  # the other DB passwords there. Never pass `--env-file`: it SHADOWS .env
  # and breaks the other services' interpolation.
  # Other host secret (mode 600, never committed):
  # slashloop-queue/db_password (compose secret file).
  # Postgres publishes NO ports — queue-db stays internal by construction.
  # Traefik: SNI/Host match on queue.slashloop.dev ONLY, TLS via the
  # existing myresolver (TLS-ALPN), body-size + rate-limit middleware.
  # Source of truth for the queue services: slashloop repo
  # deploy/queue-compose.fragment.yml (mirror changes there).
  # =========================================================================

  queue-db:
    image: postgres:17
    restart: unless-stopped
    # NO ports: section on purpose — Postgres stays on the internal network.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: slashloop_queue
      POSTGRES_USER: slashloop_queue
      POSTGRES_PASSWORD_FILE: /run/secrets/slashloop_queue_db_password
    secrets:
      - slashloop_queue_db_password
    volumes:
      - slashloop_queue_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashloop_queue -d slashloop_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  queue-api:
    image: ghcr.io/man0l/slashloop-queue-api:master
    pull_policy: always
    restart: unless-stopped
    depends_on:
      queue-db:
        condition: service_healthy
    # NO ports: section — reachable only through Traefik on the internal net.
    expose:
      - "4100"
    environment:
      QUEUE_API_PORT: "4100"
      QUEUE_DATABASE_URL: postgresql://slashloop_queue:${SLASHLOOP_QUEUE_DB_PASSWORD:?missing SLASHLOOP_QUEUE_DB_PASSWORD}@queue-db:5432/slashloop_queue
      QUEUE_API_KEY_ACTIVE_ID: ${SLASHLOOP_QUEUE_KEY_ACTIVE_ID:?missing SLASHLOOP_QUEUE_KEY_ACTIVE_ID}
      QUEUE_API_KEY_ACTIVE_SECRET: ${SLASHLOOP_QUEUE_HMAC_SECRET:?missing SLASHLOOP_QUEUE_HMAC_SECRET}
      QUEUE_API_KEY_RETIRING_ID: ${SLASHLOOP_QUEUE_KEY_RETIRING_ID:-}
      QUEUE_API_KEY_RETIRING_SECRET: ${SLASHLOOP_QUEUE_KEY_RETIRING_SECRET:-}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:4100/readyz').then(r=>{if(!r.ok)process.exit(1)})\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # SNI/Host allowlist: ONLY queue.slashloop.dev routes here.
      - "traefik.http.routers.queue-api.rule=Host(`queue.slashloop.dev`) && (Path(`/healthz`) || PathPrefix(`/v1/jobs`))"
      - "traefik.http.routers.queue-api.entrypoints=websecure"
      - "traefik.http.routers.queue-api.tls.certresolver=myresolver"
      - "traefik.http.routers.queue-api.middlewares=queue-body-limit@docker,queue-ratelimit@docker"
      - "traefik.http.services.queue-api.loadbalancer.server.port=4100"
      - "traefik.http.services.queue-api.loadbalancer.passHostHeader=true"
      # Body cap mirrors QUEUE_BODY_MAX_BYTES (64 KiB) at the edge.
      - "traefik.http.middlewares.queue-body-limit.buffering.maxRequestBodyBytes=65536"
      # Outer rate limit: 60/min sustained, 120 burst, per source IP.
      # The app enforces finer per-key/workspace/kind budgets behind this.
      - "traefik.http.middlewares.queue-ratelimit.ratelimit.average=1"
      - "traefik.http.middlewares.queue-ratelimit.ratelimit.burst=120"
      - "traefik.http.middlewares.queue-ratelimit.ratelimit.period=1s"

  queue-backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      queue-db:
        condition: service_healthy
    environment:
      PGHOST: queue-db
      PGDATABASE: slashloop_queue
      PGUSER: slashloop_queue
      PGPASSWORD_FILE: /run/secrets/slashloop_queue_db_password
      BACKUP_RETENTION_DAYS: "14"
    secrets:
      - slashloop_queue_db_password
    volumes:
      - slashloop_queue_backups:/backups
      # Absolute host path: a relative source would resolve from the compose
      # project dir and a missing source mounts as an empty DIRECTORY.
      - /root/salonease/slashloop-queue/queue-backup.sh:/usr/local/bin/queue-backup.sh:ro
    networks:
      - app-network
    # Nightly pg_dump (custom format) + local retention. Off-host copy is a
    # host cron rsync. Stock postgres:17 ships NO cron binaries, so install
    # Debian cron at container start, then run the 03:00 schedule.
    command: >
      sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cron >/dev/null 2>&1 && echo '0 3 * * * /usr/local/bin/queue-backup.sh' | crontab - && cron -f"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  pgadmin_logs:
  n8n_data:
  strapi_uploads:
  midjourney_db_data:
  flowcraft_db_data:
  flowcraft_strapi_uploads:
  paperclip_data:
  paperclip_pgdata:
  slashloop_queue_pgdata:
  slashloop_queue_backups:
  openclaw_state:

secrets:
  slashloop_queue_db_password:
    file: /root/salonease/slashloop-queue/db_password
