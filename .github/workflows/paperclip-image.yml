# Paperclip image with pg_dump (SLA-1732). Builds infra/paperclip/Dockerfile on
# top of the pinned upstream tag; pushes only from master.
name: Paperclip image

on:
  pull_request:
    paths: [infra/paperclip/Dockerfile, .github/workflows/paperclip-image.yml]
  push:
    branches: [master]
    paths: [infra/paperclip/Dockerfile, .github/workflows/paperclip-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: infra/paperclip
          file: infra/paperclip/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/man0l/paperclip:2026.1106.0-pg17
